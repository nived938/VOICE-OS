<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;font-family:Segoe UI,system-ui;color:white}body{display:flex;justify-content:center}.bar{margin-top:14px;min-width:470px;padding:14px 22px;border:1px solid rgba(255,255,255,.22);border-radius:22px;background:rgba(10,13,20,.94);box-shadow:0 12px 60px rgba(0,0,0,.45),0 0 35px rgba(170,190,255,.16);backdrop-filter:blur(18px);text-align:center}.orb{width:12px;height:12px;display:inline-block;border-radius:50%;background:#fff;box-shadow:0 0 20px #fff;margin-right:10px;animation:p 1s infinite}.title{font-size:13px;font-weight:700;letter-spacing:.08em}.hint{font-size:11px;color:#8e97a8;margin-top:5px}@keyframes p{50%{transform:scale(1.45);opacity:.65}}</style></head><body><div class="bar"><div><span class="orb"></span><span class="title">VOICE OS</span></div><div class="hint">Listening… speak your command</div></div><script>const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let r;function start(){if(!SR)return;try{r=new SR;r.lang='en-US';r.interimResults=false;r.continuous=false;r.onresult=e=>window.voiceOS.submitVoiceCommand(e.results[0][0].transcript);r.onend=()=>window.voiceOS.hideVoice();r.onerror=()=>window.voiceOS.hideVoice();r.start()}catch{window.voiceOS.hideVoice()}}window.voiceOS.onVoiceOverlayStart(start)</script></body></html>
