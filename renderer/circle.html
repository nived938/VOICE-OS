<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,system-ui;color:#fff}body{cursor:crosshair}.shade{position:absolute;inset:0;background:rgba(3,5,10,.16)}.toolbar{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid rgba(255,255,255,.2);border-radius:16px;background:rgba(10,13,20,.92);backdrop-filter:blur(16px);box-shadow:0 15px 50px #000}.toolbar b{font-size:13px}.toolbar span{font-size:11px;color:#929aaa}.toolbar button{border:1px solid #3a4150;background:#171b24;color:#fff;border-radius:8px;padding:7px 11px;cursor:pointer}.selection{position:absolute;border:2px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 25px rgba(120,170,255,.35),inset 0 0 30px rgba(120,170,255,.08);display:none}.hint{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);font-size:12px;color:#aeb6c5;background:rgba(8,11,17,.85);padding:8px 12px;border-radius:10px}</style></head><body><div class="shade"></div><div class="toolbar"><b>Circle to Search</b><span>Drag around anything on your screen</span><button id="ask">Ask VOICE OS</button><button id="close">Cancel</button></div><div id="selection" class="selection"></div><div class="hint">Hold Ctrl + Shift + Space to activate · drag · release</div><script>let down=false,sx=0,sy=0;const box=document.getElementById('selection');function reset(){box.style.display='none';down=false}document.addEventListener('mousedown',e=>{if(e.target.closest('.toolbar'))return;down=true;sx=e.clientX;sy=e.clientY;box.style.left=sx+'px';box.style.top=sy+'px';box.style.width='0';box.style.height='0';box.style.display='block'});document.addEventListener('mousemove',e=>{if(!down)return;const x=Math.min(sx,e.clientX),y=Math.min(sy,e.clientY),w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px'});document.addEventListener('mouseup',()=>{if(!down)return;down=false;document.querySelector('.hint').textContent='Selection marked. Ask VOICE OS about it.'});document.getElementById('close').onclick=()=>{reset();window.voiceOS.hideCircle()};document.getElementById('ask').onclick=()=>{window.voiceOS.hideCircle();window.voiceOS.submitVoiceCommand('Look at the selected area of my screen and help me understand it')};window.voiceOS.onCircleStart(()=>{document.querySelector('.hint').textContent='Drag around anything on your screen';reset()});</script></body></html>
